<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exception Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- VietMap GL JS (bản đồ tương tác, Pha 4 đợt code 5).

         Nạp bằng thẻ <script> chứ KHÔNG import trong TSX: package
         `@vietmap/vietmap-gl-js` không khai `main`/`module`/`exports` và lại đặt
         `"sideEffects": false`, nên Vite tree-shake sạch bundle UMD khi chỉ
         import lấy side effect — đã kiểm chứng: bản build ra không có một dòng
         mã MapLibre nào. Đây cũng đúng cách nhà cung cấp tài liệu hoá.

         File để LOCAL trong public/vendor (copy từ node_modules, phiên bản pin
         ở package.json) thay vì unpkg: hôm demo mà CDN chậm/chặn là mất luôn
         bản đồ. -->
    <link rel="stylesheet" href="/vendor/vietmap-gl/vietmap-gl.css" />
    <script src="/vendor/vietmap-gl/vietmap-gl.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
