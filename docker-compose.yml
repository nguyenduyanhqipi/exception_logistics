services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: exception_logistics
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/exception_logistics
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python worker/job_processor.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/exception_logistics
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://34.142.218.150:8000
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
