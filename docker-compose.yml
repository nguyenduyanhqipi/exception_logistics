services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: exception_logistics
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/exception_logistics
      # Giờ địa phương của nghiệp vụ (mục 4: companies.timezone). `stops[].eta`
      # / `sla_deadline` là giờ tường (naive) theo giờ VN, và severity/impact
      # so chúng với `datetime.now()` naive — container chạy UTC làm lệch 7
      # tiếng theo hướng "mọi thứ trông như chưa tới giờ". Các mốc tuyệt đối
      # (JWT, quota LLM, RAG) đều dùng datetime.now(timezone.utc) nên KHÔNG bị
      # biến này ảnh hưởng.
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m worker.job_processor
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/exception_logistics
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://34.142.218.150:8000
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
